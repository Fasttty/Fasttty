<script>
const moods=['Радость','Спокойствие','Усталость','Тревога','Грусть','Выгоревший','Влюблённость'];
const themes={honey:'Карамель',plum:'Сливовая ночь',wine:'Тёмное вино',ink:'Полночь'};
const themeKey='ryadom-theme';
document.documentElement.dataset.theme=Object.hasOwn(themes,localStorage.getItem(themeKey))?localStorage.getItem(themeKey):'honey';
const colors={paper:'Фон',surface:'Карточки',raised:'Поля и вторичные кнопки',ink:'Текст',muted:'Второстепенный текст',plum:'Акцент',line:'Рамки',warm:'Луна и дата'};
const paletteKey='ryadom-custom-colors';
let custom={};
try{custom=JSON.parse(localStorage.getItem(paletteKey))||{}}catch{}
function applyColors(){
 const root=document.documentElement;
 for(const key of Object.keys(colors)){
  const value=custom[key];
  if(/^#[0-9a-f]{6}$/i.test(value||''))root.style.setProperty('--'+key,value);
  else root.style.removeProperty('--'+key);
 }
 const accent=getComputedStyle(root).getPropertyValue('--plum').trim();
 const channels=accent.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);
 root.style.setProperty('--accent-ink',channels.reduce((sum,x,i)=>sum+x*[.2126,.7152,.0722][i],0)>.179?'#100c15':'#ffffff');
 const paper=getComputedStyle(root).getPropertyValue('--paper').trim();
 window.RyadomCloud?.setBars(paper);
}
applyColors();
function themeControls(){
 const root=document.documentElement,style=getComputedStyle(root);
 return '<div class="theme-picker">'+Object.entries(themes).map(([key,label])=>'<button type="button" data-action="theme:'+key+'" aria-pressed="'+(root.dataset.theme===key&&!Object.keys(custom).length)+'"><i class="swatch '+key+'"></i>'+label+'</button>').join('')+'</div>'+
 '<div class="color-grid">'+Object.entries(colors).map(([key,label])=>'<label>'+label+'<input aria-label="'+label+'" type="color" data-color="'+key+'" value="'+style.getPropertyValue('--'+key).trim()+'"></label>').join('')+'</div>'+
 '<p class="muted">Цвета сохраняются на этом телефоне.</p>'+btn('Сбросить свои цвета','reset-colors');
}
const moodIndex=value=>moods.findIndex(m=>value===m||value?.endsWith(' '+m));
const moodArt=(index,description='')=>'<img class="mood-art" src="art-'+index+'.webp" alt="'+esc(description)+'">';
const kyivClock=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Kyiv',hour:'2-digit',hourCycle:'h23'});
const ritualOpen=(now=new Date())=>{const hour=Number(kyivClock.format(now));return hour>=21||hour<3};

const needs=['Просто поделиться','Хочу поговорить','Нужна поддержка','Хочу побыть в тишине'];
const ideas=['Созвонитесь и приготовьте одинаковый десерт.','Устройте вечер старых фотографий.','Возьмите напитки и прогуляйтесь по новому маршруту.','Обменяйтесь тремя любимыми песнями.'];
const quizzes=[
 {title:'Как мы чувствуем заботу',items:[['После трудного дня мне приятнее…','Спокойно поговорить','Получить помощь с делами','Побыть немного в тишине'],['В обычный день я особенно ценю…','Тёплое сообщение','Время вдвоём','Маленький сюрприз'],['Если я расстроен, мне помогает…','Когда меня выслушивают','Когда предлагают решение','Когда спрашивают, что мне нужно']]},
 {title:'Наше идеальное свидание',items:[['Где хочется побыть вдвоём?','Дома','На природе','В новом месте'],['Как спланировать встречу?','Договориться заранее','Решить по настроению','Сделать друг другу сюрприз'],['Что особенно запоминается?','Долгий разговор','Новое занятие','Маленькая традиция']]},
 {title:'Как мы слышим друг друга',items:[['Сложный разговор лучше начать…','Когда оба готовы','Коротким сообщением','Прогулкой вдвоём'],['Если разговор накалился, я предпочитаю…','Взять паузу','Сказать, что чувствую','Выслушать до конца'],['После ссоры мне важнее…','Понять чувства друг друга','Договориться, что делать дальше','Восстановить тепло между нами']]},{"title": "На расстоянии", "items": [["Что сближает на расстоянии?", "Созвон", "Фото дня", "Совместная игра"], ["Когда удобнее быть на связи?", "Утром", "Днём", "Вечером"], ["Как пережить разлуку?", "Планировать встречу", "Чаще переписываться", "Оставлять друг другу время"]]},{"title": "Свидание мечты", "items": [["Куда пойдём?", "На природу", "В кино", "В новое кафе"], ["Какой темп?", "Спокойный", "Активный", "Спонтанный"], ["Что останется на память?", "Фото", "Сувенир", "История"]]},{"title": "Границы", "items": [["Как попросить время на себя?", "Сказать прямо", "Написать", "Договориться заранее"], ["Как обсуждать сложное?", "Лично", "По телефону", "В переписке"], ["Что помогает успокоиться?", "Пауза", "Прогулка", "Объятия"]]},{"title": "Будущее", "items": [["Что важнее запланировать?", "Встречу", "Поездку", "Общую цель"], ["Как принимать решения?", "Обсудить вместе", "Собрать варианты", "Дать себе время"], ["Как отмечать успех?", "Устроить вечер", "Сделать фото", "Рассказать друг другу"]]},{"title": "Быт и привычки", "items": [["Как провести выходной?", "Дома", "На прогулке", "В гостях"], ["Как делить дела?", "По очереди", "По предпочтениям", "По свободному времени"], ["Какой ритуал начать?", "Завтрак", "Вечерний звонок", "Список благодарностей"]]}
];
const nav=document.querySelector('#nav'), view=document.querySelector('#view'), profile=document.querySelector('#profile'), status=document.querySelector('#status');
const tabs=['Сегодня','Календарь','Разговоры','Дневник','Профиль'];
const icons=['<path d="M3 10.5 12 3l9 7.5V21H3z M9 21v-7h6v7"/>','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18"/>','<path d="M20 15a3 3 0 0 1-3 3H9l-5 3v-5a3 3 0 0 1-1-2V7a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3z M7 9h9m-9 4h6"/>','<path d="M5 3h12a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V5a2 2 0 0 1 1-2z M4 17h15m-11-9h7m-7 4h5"/>','<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'];
let state,tab=0,mode='register',date,month,edit=null,idea=0,quiz=0,busy=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(label,name,value='',extra='')=>'<label>'+label+'<input name="'+name+'" value="'+esc(value)+'" '+extra+'></label>';
const area=(label,name,value='',max=400)=>'<label>'+label+'<textarea name="'+name+'" maxlength="'+max+'">'+esc(value)+'</textarea></label>';
const btn=(label,action,cls='')=>'<button type="button" class="'+cls+'" data-action="'+action+'">'+label+'</button>';
const card=(tag,title,body)=>'<section class="card"><div class="eyebrow">'+tag+'</div><h2>'+title+'</h2>'+body+'</section>';
const form=(name,body,label='Сохранить')=>'<form data-form="'+name+'">'+body+'<button class="primary">'+label+'</button></form>';
const fmt=s=>new Date(s+'T12:00:00Z').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
const avatar=p=>p?.avatar?'<img class="avatar" alt="" src="'+esc(p.avatar)+'">':'<span class="avatar">'+esc(p?.name?.[0]||'♡')+'</span>';
const person=id=>id===state.me.id?state.me:state.partner;
const mine=(kind,day=state.day)=>state.entries.find(r=>r.kind===kind&&r.day===day&&r.author===state.me.id)?.data||{};
const dayIndex=()=>Math.floor(Date.parse(state.day)/86400000);
function msg(text='',error=false){status.textContent=text;status.dataset.error=error}
let sequence=0;
const pending=new Map();
window.cloudReply=(id,reply)=>{
 const task=pending.get(id);
 if(!task)return;
 pending.delete(id);
 if(reply.status>=400)task.reject(Object.assign(new Error(reply.error),{code:reply.status}));
 else task.resolve(reply);
};
const api=(path,data)=>new Promise((resolve,reject)=>{
 const id=++sequence;
 pending.set(id,{resolve,reject});
 RyadomCloud.request(id,path,data===undefined?null:JSON.stringify(data));
});
async function load(){
 try{state=await api('state');extrasData=state.wallet?await api('extras'):null;appreciation=state.wallet&&state.partner?(await api('appreciation')).items:[];date??=state.day;month??=date.slice(0,7)}
 catch(e){if(e.code!==401)throw e;state=null}
 render();
}
let onboardStep=0, swipeStart=null;
function moveOnboard(next){
 const deck=view.querySelector('.onboard-deck');
 if(!deck||next<0||next>3)return;
 const slides=[...deck.querySelectorAll('.onboard-step')];
 if(next>onboardStep){
  const invalid=[...slides[onboardStep].elements].find(input=>!input.validity.valid);
  if(invalid){invalid.reportValidity();return}
 }
 onboardStep=next;
 deck.style.setProperty('--slide',next);
 deck.querySelector('.onboard-progress').textContent='Шаг '+(next+1)+' из 4';
 deck.querySelectorAll('.onboard-dots i').forEach((dot,i)=>dot.classList.toggle('active',i===next));
 slides.forEach((slide,i)=>{slide.inert=i!==next;slide.setAttribute('aria-hidden',String(i!==next))});
 deck.querySelector('[data-action="onboard-back"]').disabled=next===0;
 deck.querySelector('[data-action="onboard-next"]').hidden=next===3;
 deck.querySelector('button[type="submit"]').hidden=next!==3;
}
view.addEventListener('touchstart',e=>{
 if(e.target.closest('.onboard-window'))swipeStart=[e.touches[0].clientX,e.touches[0].clientY];
},{passive:true});
view.addEventListener('touchcancel',()=>{swipeStart=null});
view.addEventListener('touchend',e=>{
 if(!swipeStart)return;
 const [x,y]=swipeStart;swipeStart=null;
 const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)moveOnboard(onboardStep+(dx<0?1:-1));
},{passive:true});
function auth(){
 const login=field('Логин','login','','required minlength="3" maxlength="40" autocomplete="username" autocapitalize="none"')+
 field('Пароль','password','','type="password" required minlength="8" maxlength="128" autocomplete="'+(mode==='login'?'current-password':'new-password')+'"');
 const step=(number,title,content)=>'<fieldset class="onboard-step"><legend>'+title+'</legend><h2 class="onboard-title" aria-hidden="true"><span>'+number+'</span>'+title+'</h2>'+content+'</fieldset>';
 const options=(name,items)=>'<div class="onboard-options">'+items.map(([value,label])=>'<label><input required type="radio" name="'+name+'" value="'+value+'"><span>'+label+'</span></label>').join('')+'</div>';
 const body=mode==='login'?step('♥','Войти в «Рядом»',login):
 step('01','Твой профиль',field('Имя','name','','required maxlength="32" autocomplete="nickname"')+login)+
 step('02','Твой пол',options('gender',[['female','Женский'],['male','Мужской'],['other','Другой'],['skip','Не указывать']]))+
 step('03','Как вы сейчас?',options('relationship',[['new','Недавно вместе'],['together','Давно вместе'],['distance','На расстоянии'],['skip','Пропустить']]))+
 step('04','Что хочется делать вместе?',options('goal',[['care','Заботиться друг о друге'],['memories','Сохранять моменты'],['plans','Строить планы'],['skip','Пропустить']]));
 const controls='<div class="onboard-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="onboard-controls">'+btn('← Назад','onboard-back')+btn('Далее →','onboard-next','primary')+'<button type="submit" class="primary" hidden>Создать аккаунт</button></div>';
 return '<div class="onboard"><section class="onboard-hero"><small>ПРОСТРАНСТВО ДЛЯ ДВОИХ</small><h1>'+(mode==='login'?'С возвращением':'Давайте знакомиться')+'</h1></section>'+
 (mode==='login'?form(mode,body,'Войти'):'<form data-form="register" class="onboard-deck" novalidate><div class="onboard-progress" aria-live="polite"></div><div class="onboard-window"><div class="onboard-track">'+body+'</div></div>'+controls+'</form>')+
 '<p>'+btn(mode==='login'?'Создать аккаунт':'Уже есть аккаунт','mode')+'</p></div>';
}
function replies(kind,transform,day=state.day){
 const rows=state.entries.filter(x=>x.kind===kind&&x.day===day);
 if(rows.length===2)return rows.map(x=>'<div class="entry"><strong>'+esc(person(x.author).name)+'</strong><div class="result">'+transform(x.data)+'</div></div>').join('');
 return '<p class="muted">'+(state.waiting.includes(kind+'/'+day)?'Партнёр уже ответил. Добавь свой ответ, чтобы увидеть его.':rows.length?'Твой ответ сохранён. Ответ партнёра появится здесь.':'Ответы откроются после того, как вы оба ответите.')+'</p>';
}

async function resize(file){
 if(!file?.size)return;
 if(file.size>12000000)throw Error('Выбери фото размером до 12 МБ.');
 const bmp=await createImageBitmap(file),s=Math.min(bmp.width,bmp.height),canvas=document.createElement('canvas');
 canvas.width=canvas.height=256;
 canvas.getContext('2d').drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,256,256);
 bmp.close();
 return canvas.toDataURL('image/jpeg',.78);
}

document.addEventListener('submit',e=>{
 const name=e.target.dataset.form;if(!name)return;e.preventDefault();
 if(name==='register'){
  if(onboardStep<3){moveOnboard(onboardStep+1);return}
  const invalid=[...e.target.querySelectorAll('input')].find(input=>!input.validity.valid);
  if(invalid){moveOnboard([...e.target.querySelectorAll('fieldset')].indexOf(invalid.closest('fieldset')));invalid.reportValidity();return}
 }
 const f=new FormData(e.target),data=Object.fromEntries(f);
 run(async()=>{
  if(name==='appreciation')await api('appreciation',{note:data.note,photo:await resize(f.get('photo'))});
  else if(name==='appreciation-review')await api('appreciation',{action:'review',id:data.id,score:Number(data.score)});
  else if(name==='cycle')await api('cycle',{day:data.day,phase:data.phase,shared:data.shared==='on'});
  else if(name==='register'||name==='login'||name==='join')await api(name,data);
  else if(name==='profile')await api(name,{name:data.name,avatar:data.clear?'':await resize(f.get('avatar'))});
  else if(name==='calendar'){
    const old=state.entries.find(x=>x.id===edit);
    await entry(old?.kind||data.kind,{...data,done:old?.data.done},data.day,old?.id);
    date=data.day;month=date.slice(0,7);edit=null;
  }else if(name==='quiz')await entry('quiz'+quiz,{answers:[data.q0,data.q1,data.q2].join(',')});
  else if(name==='ritual'){
   if(!ritualOpen()){render();throw Error('Ритуал доступен с 21:00 до 03:00 по Киеву.')}
   await entry(name,data,state.day);
  }else await entry(name,data);
  await load();msg('Сохранено.');
 });
});
render();
run(load);
let syncBusy=false;
async function sync(){
 if(!state||busy||syncBusy||document.hidden)return;
 syncBusy=true;
 try{
  const fresh=await api('state');
  if(busy)return;
  const typing=view.querySelector('form:focus-within')||view.querySelector('form[data-dirty]');
  if(typing)return;
  if(tab===4&&fresh.wallet){
   const next=await api('extras'),items=fresh.partner?(await api('appreciation')).items:[];
   if(busy||view.querySelector('form:focus-within,form[data-dirty]'))return;
   if(JSON.stringify(next)!==JSON.stringify(extrasData)||JSON.stringify(items)!==JSON.stringify(appreciation)){
    extrasData=next;appreciation=items;state=fresh;render();return;
   }
  }
  if(JSON.stringify(state)!==JSON.stringify(fresh)){state=fresh;render()}
 }catch(e){if(e.code===401&&!busy){state=null;render()}}
 finally{syncBusy=false}
}
view.addEventListener('input',e=>{
 const key=e.target.dataset.color;
 if(Object.hasOwn(colors,key)){
  custom[key]=e.target.value;localStorage.setItem(paletteKey,JSON.stringify(custom));applyColors();
  view.querySelectorAll('.theme-picker [aria-pressed]').forEach(b=>b.setAttribute('aria-pressed','false'));
 }else e.target.closest('form')?.setAttribute('data-dirty','');
});
function refreshRitual(){
 if(!state||tab!==0||busy)return;
 const section=view.querySelector('.ritual');
 if(section&&section.classList.contains('is-open')!==ritualOpen())section.outerHTML=ritual();
}
setInterval(()=>{refreshRitual();sync()},12000);
document.addEventListener('visibilitychange',()=>{refreshRitual();sync()});
</script></html>
